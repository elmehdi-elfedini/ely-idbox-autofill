name: Release browser extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check sidepanel.js

      - name: Build tagged package
        run: python scripts/package_extension.py --tag "$GITHUB_REF_NAME" --output dist/ely-idbox.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/ely-idbox.zip --title "ELY-IDBox $GITHUB_REF_NAME" --generate-notes

      - name: Publish to Chrome Web Store
        if: ${{ vars.PUBLISH_CHROME == 'true' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish-stores.mjs chrome dist/ely-idbox.zip

      - name: Publish to Microsoft Edge Add-ons
        if: ${{ vars.PUBLISH_EDGE == 'true' }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ vars.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        run: node scripts/publish-stores.mjs edge dist/ely-idbox.zip
